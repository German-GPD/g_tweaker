name: Build G_Tweaker (C#)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - csharp-winui-migration
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore G_Tweaker.sln
      - name: Test core catalogue
        run: dotnet test tests/G_Tweaker.Tests/G_Tweaker.Tests.csproj --configuration Release
      - name: Publish x64 executable
        run: dotnet publish src/G_Tweaker.App/G_Tweaker.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/G_Tweaker-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: G_Tweaker-win-x64
          path: artifacts/G_Tweaker-win-x64/
